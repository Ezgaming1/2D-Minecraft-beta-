<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>2D Minecraft Launcher</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="launcher-container">
    <h1>2D Minecraft Launcher</h1>
    <div class="form-group">
      <label for="worldName">World Name:</label>
      <input type="text" id="worldName" value="My World">
    </div>
    <div class="form-group">
      <label for="worldSeed">Seed (Number):</label>
      <input type="number" id="worldSeed" value="1337">
    </div>
    <button id="launchBtn">Launch Game</button>
  </div>

  <script>
    document.getElementById('launchBtn').addEventListener('click', () => {
      const name = document.getElementById('worldName').value || "My World";
      const seed = parseInt(document.getElementById('worldSeed').value) || 1337;

      const worldData = {
        name: name,
        seed: seed,
        settings: {
          maxWorldHeight: 120
        },
        changes: {}
      };

      sessionStorage.setItem('activeWorld', JSON.stringify(worldData));
      window.location.href = 'game.html';
    });
  </script>
</body>
</html>
